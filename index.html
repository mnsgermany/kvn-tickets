<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140906">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>КВН «Решающее направление» · Билеты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff5a1f' d='M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-3 1.5-4.5 2.5-6 .5 2 1.5 3 2.5 3-1-3 0-6 0-8z'/%3E%3C/svg%3E">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-3 1.5-4.5 2.5-6 .5 2 1.5 3 2.5 3-1-3 0-6 0-8z"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3L2 21h20L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v5M12 18v.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a3 3 0 0 0 0 6v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a3 3 0 0 0 0-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
</svg>

<header class="top">
  <div class="brand">
    <svg class="flame" aria-hidden="true"><use href="#i-flame"/></svg>
    <div><b id="eventTitle">Решающее направление</b><small>КВН · контроль билетов</small></div>
  </div>
  <button id="logoutBtn" class="ghost" hidden>Выйти</button>
</header>

<!-- Вход -->
<main id="loginView" class="view login">
  <div class="hero">
    <svg class="flame big" aria-hidden="true"><use href="#i-flame"/></svg>
    <h1>На входе — <span>жара</span></h1>
    <p>Войди как администратор, чтобы сканировать билеты</p>
  </div>
  <form id="loginForm" class="card">
    <label for="login">Логин</label>
    <input id="login" autocomplete="username" autocapitalize="none" placeholder="admin1" required>
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <p id="loginErr" class="err" role="alert"></p>
    <button class="primary" type="submit">Войти</button>
  </form>
</main>

<!-- Приложение -->
<main id="appView" class="view" hidden>
  <section id="tab-scan" class="tab">
    <div class="stats" aria-live="polite">
      <div><b id="stIn">0</b><small>прошли</small></div>
      <div class="bar" aria-hidden="true"><i id="stBar"></i></div>
      <div><b id="stTotal">0</b><small>билетов</small></div>
    </div>
    <div class="reader-wrap">
      <div id="reader"></div>
      <div id="camIdle" class="cam-idle">
        <svg aria-hidden="true"><use href="#i-scan"/></svg>
        <button id="camBtn" class="primary">Включить камеру</button>
        <p id="camHint" class="hint"></p>
      </div>
    </div>
    <form id="manualForm" class="manual">
      <label for="manual" class="sr-only">Код билета вручную</label>
      <input id="manual" inputmode="numeric" placeholder="Код вручную: 12 цифр" autocomplete="off">
      <button class="secondary" type="submit">Проверить</button>
    </form>
  </section>

  <section id="tab-tickets" class="tab" hidden>
    <div class="actions">
      <button id="addBtn" class="primary">+ Выпустить билет</button>
      <button id="vipBtn" class="gold">★ Создать VIP</button>
    </div>
    <ul id="ticketList" class="list"></ul>
    <button id="resetAllBtn" class="danger wide">Сбросить все проходы</button>
  </section>

  <section id="tab-log" class="tab" hidden>
    <ul id="logList" class="list log"></ul>
  </section>

  <nav class="tabs" aria-label="Разделы">
    <button data-tab="scan" aria-current="page"><svg aria-hidden="true"><use href="#i-scan"/></svg>Скан</button>
    <button data-tab="tickets"><svg aria-hidden="true"><use href="#i-ticket"/></svg>Билеты</button>
    <button data-tab="log"><svg aria-hidden="true"><use href="#i-list"/></svg>Журнал</button>
  </nav>
</main>

<!-- Результат скана на весь экран -->
<div id="result" class="result" hidden role="alertdialog" aria-live="assertive" tabindex="-1">
  <svg class="r-icon" aria-hidden="true"><use id="rIcon" href="#i-ok"/></svg>
  <h2 id="rTitle"></h2>
  <p id="rCode" class="r-code"></p>
  <p id="rInfo"></p>
  <small>Нажми, чтобы сканировать дальше</small>
</div>

<!-- QR билета -->
<dialog id="qrDialog">
  <canvas id="qrCanvas" width="600" height="760" aria-label="Билет с QR-кодом"></canvas>
  <div class="actions">
    <a id="qrDownload" class="primary btn" download>Скачать PNG</a>
    <button id="qrShare" class="secondary">Поделиться</button>
    <button id="qrClose" class="ghost">Закрыть</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
